<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Block Menu Editor Demo V3</title>
<style>
:root{
  --bg:#090d13;--panel:#111821;--panel2:#0b1118;--line:#2a3645;
  --text:#f4f7f9;--muted:#8492a4;--cyan:#70ded8;--coral:#ff916f;
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#080c12,#0b1017 56%,#090d13);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}
button,input,select{font:inherit}button{cursor:pointer}
.app{width:min(820px,100%);margin:auto;padding:18px 14px 100px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.top h1{margin:0;font-size:24px;letter-spacing:-.035em}.sub{margin-top:5px;color:var(--muted);font-size:11px}
.status{flex:0 0 auto;border:1px solid #345144;background:#102019;color:#91e7bb;border-radius:999px;padding:6px 9px;font-size:9px;font-weight:850}
.meta-card{border:1px solid var(--line);background:#111821;border-radius:15px;padding:14px}
.meta{display:grid;grid-template-columns:1.4fr .55fr;gap:9px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}
label{font-size:10px;color:#8e9bad;font-weight:800}
input,select{width:100%;min-height:40px;padding:8px 10px;border:1px solid #303d4d;border-radius:9px;background:#0a1017;color:#f5f7f9;outline:none}
.summary{display:flex;gap:0;margin-top:11px;padding-top:11px;border-top:1px solid #253142}
.summary>div{flex:1;padding:0 10px;border-right:1px solid #253142}.summary>div:first-child{padding-left:0}.summary>div:last-child{border-right:0}
.summary b{display:block;font-size:15px}.summary span{display:block;margin-top:2px;color:#728094;font-size:8px}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:18px 2px 9px}
.section-head b{font-size:15px}.section-head span{font-size:9px;color:#758398}

/* compact block navigator */
.block-nav-wrap{position:sticky;top:6px;z-index:10;margin:0 0 11px;padding:7px;border:1px solid #263243;border-radius:12px;background:rgba(12,18,26,.94);backdrop-filter:blur(10px)}
.block-nav{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}.block-nav::-webkit-scrollbar{display:none}
.block-tab{flex:0 0 auto;min-width:74px;min-height:40px;padding:7px 10px;border:1px solid #344255;border-radius:10px;background:#111923;color:#aab6c3;text-align:center;font-size:10px;font-weight:900}
.block-tab span{display:block;margin-top:2px;font-size:8px;color:#718093;font-weight:700}
.block-tab.active{color:white;border-color:var(--accent,#70ded8);box-shadow:inset 0 -3px 0 var(--accent,#70ded8);background:#17202b}

.blocks{display:grid;gap:13px}
.block{--accent:#70ded8;--wash:rgba(112,222,216,.08);border:1px solid color-mix(in srgb,var(--accent) 44%,#2a3645);border-radius:16px;overflow:hidden;background:#0d141d;box-shadow:0 10px 28px rgba(0,0,0,.14)}
.block:nth-child(1){--accent:#64d8d0;--wash:rgba(100,216,208,.10)}
.block:nth-child(2){--accent:#ff9b78;--wash:rgba(255,155,120,.10)}
.block:nth-child(3){--accent:#b894ff;--wash:rgba(184,148,255,.10)}
.block:nth-child(4){--accent:#7ed9a9;--wash:rgba(126,217,169,.10)}
.block:nth-child(5){--accent:#efc96f;--wash:rgba(239,201,111,.10)}
.block:nth-child(6){--accent:#7bb7ff;--wash:rgba(123,183,255,.10)}
.block-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;background:linear-gradient(90deg,var(--wash),transparent 45%),#121a24;border-top:4px solid var(--accent);border-bottom:1px solid color-mix(in srgb,var(--accent) 22%,#293647)}
.block-index{display:flex;align-items:baseline;gap:5px;min-width:78px}.block-index span{color:#758397;font-size:8px;font-weight:900;letter-spacing:.12em}.block-index strong{color:var(--accent);font-size:24px;line-height:1;font-weight:950;letter-spacing:-.04em}
.block-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.block-pill{display:flex;align-items:center;gap:6px;min-height:32px;padding:5px 8px;border:1px solid #344255;border-radius:9px;background:#0d141d}
.block-pill label{color:#7f8d9f;font-size:8px}.block-pill select,.block-pill input{width:auto;min-width:52px;min-height:24px;padding:2px 5px;border:0;background:transparent;box-shadow:none;font-size:10px}.block-pill input{min-width:86px}
.block-actions{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}.block-btn{min-height:30px;padding:5px 7px;border:1px solid #344255;border-radius:8px;background:#151e29;color:#c7d1dc;font-size:9px;font-weight:850}
.block-body{padding:12px 14px 14px}.block.collapsed .block-body{display:none}.block.collapsed .block-head{border-bottom:0}
.exercise-list{display:grid;gap:7px}.exercise{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 11px;border:1px solid #293648;border-radius:11px;background:#0a1017}
.ex-num{width:28px;height:28px;display:grid;place-items:center;border-radius:7px;background:color-mix(in srgb,var(--accent) 15%,#172331);color:var(--accent);font-size:10px;font-weight:900}
.ex-name{font-size:12px;font-weight:900}.ex-detail{width:100%;margin-top:6px;min-height:31px;padding:5px 7px;border-radius:7px;font-size:10px}
.ex-actions{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}.replace{min-height:30px;padding:5px 8px;border:1px solid #6c5047;border-radius:8px;background:#211814;color:#ffc0aa;font-size:9px;font-weight:900}.exbtn{min-height:30px;padding:5px 7px;border:1px solid #344255;border-radius:8px;background:#151e29;color:#c7d1dc;font-size:9px}
.insert-row{display:flex;justify-content:center}.insert{margin:-1px 0;border:1px dashed #3b4a5d;border-radius:999px;background:#0d141c;color:#8796aa;padding:4px 10px;font-size:8.5px}.add-in-block{width:100%;margin-top:9px;min-height:36px;border:1px dashed color-mix(in srgb,var(--accent) 45%,#425166);border-radius:9px;background:#0c131b;color:#aebac7;font-size:10px;font-weight:850}
.add-block{width:100%;margin-top:14px;min-height:46px;border:1px dashed #5a4f4b;border-radius:12px;background:#151315;color:#ffc0aa;font-weight:900}

.sticky{position:fixed;left:0;right:0;bottom:0;background:rgba(9,13,19,.94);border-top:1px solid #263243;backdrop-filter:blur(12px);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.sticky-inner{width:min(820px,100%);margin:auto;display:flex;gap:8px}.btn{flex:1;min-height:44px;border-radius:10px;border:1px solid #344154;background:#151d28;color:#fff;font-weight:900}.btn.primary{background:linear-gradient(135deg,#2b918c,#4ed0c8);border-color:#4ed0c8;color:#061110}

/* picker */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.74);display:none;align-items:end;z-index:30}.modal.open{display:flex}
.sheet{width:min(820px,100%);max-height:88vh;overflow:auto;margin:auto;background:#111821;border:1px solid #354255;border-radius:20px 20px 0 0;padding:15px 14px 22px}
.sheet-top{display:flex;justify-content:space-between;gap:10px}.sheet h2{font-size:18px;margin:0}.sheet p{font-size:10px;color:#8492a4;margin:5px 0 0}.close{border:0;background:transparent;color:#aab5c2;font-size:22px}
.search{margin:13px 0 9px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.chip{border:1px solid #354255;border-radius:999px;background:#0d141d;color:#aeb9c6;padding:6px 9px;font-size:9px;font-weight:850}.chip.on{border-color:#5ebbb6;color:#c1f2ef;background:#102324}
.options{display:grid;grid-template-columns:1fr 1fr;gap:7px}.option{text-align:left;min-height:45px;padding:8px 10px;border:1px solid #2c3949;border-radius:9px;background:#0c131b;color:#eef2f6}.option b{display:block;font-size:11px}.option span{display:block;margin-top:3px;color:#7d8b9d;font-size:8px}
.custom{display:grid;grid-template-columns:1fr auto;gap:7px;margin-top:12px;padding-top:12px;border-top:1px solid #293547}.custom button{border:1px solid #6b5147;border-radius:9px;background:#211814;color:#ffc0aa;padding:8px 10px;font-weight:850}

@media(max-width:620px){
  .meta{grid-template-columns:1fr}
  .section-head{margin-top:15px}
  .section-head span{display:none}
  .block-nav-wrap{top:4px;margin-bottom:9px}
  .blocks{gap:9px}
  .block{display:none}
  .block.mobile-active{display:block}
  .block-head{grid-template-columns:auto minmax(0,1fr);gap:8px;padding:11px 10px}
  .block-index{min-width:66px}.block-index strong{font-size:22px}
  .block-actions{grid-column:2;justify-content:flex-start}
  .block-meta{gap:5px}.block-pill{min-height:29px;padding:4px 6px}.block-pill input{min-width:74px}
  .block-body{padding:10px}
  .exercise{grid-template-columns:30px minmax(0,1fr);padding:9px}
  .ex-actions{grid-column:2;justify-content:flex-start}
  .options{grid-template-columns:1fr}
  .add-block{margin-top:10px}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div>
      <h1>修改日常菜單</h1>
      <div class="sub">核心線條雕塑｜Block 編輯模式</div>
    </div>
    <div class="status">ADMIN · 可修改</div>
  </div>

  <div class="meta-card meta">
    <div class="field"><label>菜單名稱</label><input value="核心線條雕塑"></div>
    <div class="field"><label>Level</label><select><option>III</option><option>IV</option><option>V</option></select></div>
    <div class="field full"><label>簡介</label><input value="核心＋全身 conditioning，以數個 Block 組成"></div>
    <div class="summary field full">
      <div><b id="sumBlocks">4</b><span>BLOCKS</span></div>
      <div><b id="sumMoves">12</b><span>不同站</span></div>
      <div><b>約 45–55</b><span>分鐘</span></div>
    </div>
  </div>

  <div class="section-head">
    <b>菜單內容</b>
    <span>手機點上方 Block 可直接切換，不必一路往下滑</span>
  </div>

  <div class="block-nav-wrap">
    <div class="block-nav" id="blockNav"></div>
  </div>

  <div class="blocks" id="blocks"></div>
  <button class="add-block" onclick="addBlock()">＋ 新增 Block</button>
</div>

<div class="sticky"><div class="sticky-inner">
  <button class="btn">取消</button>
  <button class="btn primary">儲存修改</button>
</div></div>

<div class="modal" id="modal"><div class="sheet">
  <div class="sheet-top"><div><h2 id="pickerTitle">替換動作</h2><p id="pickerSub"></p></div><button class="close" onclick="closePicker()">×</button></div>
  <input id="search" class="search" placeholder="搜尋 TRX、core、step-up…" oninput="renderOptions()">
  <div class="chips" id="chips"></div><div class="options" id="options"></div>
  <div class="custom"><input id="customName" placeholder="找不到？直接新增自己的動作"><button onclick="addCustom()">新增</button></div>
</div></div>

<script>
const library=[
['Bike','Cardio'],['Brisk Walk','Cardio'],['Incline Walk','Cardio'],['Stair Climber','Cardio'],
['Box Step-Up','Bodyweight'],['Bodyweight Squat','Bodyweight'],['Reverse Lunge','Bodyweight'],['Wall Sit','Bodyweight'],
['Mountain Climber','Core'],['Reverse Crunch','Core'],['Side Plank Hip Lift','Core'],['Plank Shoulder Tap','Core'],['Stability Ball Rollout','Core'],['Stability Ball Stir-the-Pot','Core'],['Hollow Body Hold','Core'],
['TRX Row','TRX'],['TRX Y Raise','TRX'],['TRX Face Pull','TRX'],['TRX Reverse Fly','TRX'],['TRX Knee Tuck','TRX'],['TRX Pike','TRX'],['TRX Body Saw','TRX'],['TRX Fallout','TRX'],['TRX Mountain Climber','TRX'],
['Farmers Carry','Carry'],['Suitcase Carry','Carry'],['Front Rack Carry','Carry'],['Kettlebell Swing','Kettlebell'],['Medicine Ball Slam','Conditioning'],['Wall Balls','Conditioning']
];
let blocks=[
{rounds:1,rest:'不休息',collapsed:false,items:[{name:'Bike',detail:'5 min · easy'},{name:'Mountain Climber',detail:'25 sec · controlled'},{name:'Box Step-Up',detail:'16 reps'}]},
{rounds:3,rest:'60 sec',collapsed:false,items:[{name:'TRX Row',detail:'12–15 reps'},{name:'Reverse Crunch',detail:'15 reps'},{name:'Suitcase Carry',detail:'40 m / side'}]},
{rounds:3,rest:'75 sec',collapsed:false,items:[{name:'Medicine Ball Slam',detail:'15 reps'},{name:'Side Plank Hip Lift',detail:'12 / side'},{name:'Stair Climber',detail:'3 min · steady'}]},
{rounds:1,rest:'—',collapsed:false,items:[{name:'Farmers Carry',detail:'80 m · RPE 6–7'},{name:'TRX Body Saw',detail:'12 reps'},{name:'Wall Balls',detail:'20 reps'}]}
];
let activeBlock=0,target={block:null,item:null,mode:'replace'},activeCat='全部';

function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderNav(){
  blockNav.innerHTML=blocks.map((b,i)=>`<button class="block-tab ${i===activeBlock?'active':''}" style="--accent:${['#64d8d0','#ff9b78','#b894ff','#7ed9a9','#efc96f','#7bb7ff'][i%6]}" onclick="setActive(${i})">BLOCK ${i+1}<span>${b.items.length} 站 · ${b.rounds} round${b.rounds>1?'s':''}</span></button>`).join('');
}
function setActive(i){activeBlock=i;render();requestAnimationFrame(()=>document.querySelector('.block.mobile-active')?.scrollIntoView({block:'nearest',behavior:'smooth'}))}
function render(){
  renderNav();
  blocksEl=document.getElementById('blocks');
  blocksEl.innerHTML=blocks.map((b,bi)=>`
  <section class="block ${b.collapsed?'collapsed':''} ${bi===activeBlock?'mobile-active':''}">
    <div class="block-head">
      <div class="block-index"><span>BLOCK</span><strong>${bi+1}</strong></div>
      <div class="block-meta">
        <div class="block-pill"><label>輪數</label><select onchange="blocks[${bi}].rounds=Number(this.value);renderNav()">${[1,2,3,4,5].map(n=>`<option ${b.rounds===n?'selected':''}>${n}</option>`).join('')}</select></div>
        <div class="block-pill"><label>休息</label><input value="${esc(b.rest)}" onchange="blocks[${bi}].rest=this.value"></div>
      </div>
      <div class="block-actions">
        <button class="block-btn" onclick="toggleBlock(${bi})">${b.collapsed?'展開':'收合'}</button>
        <button class="block-btn" onclick="moveBlock(${bi},-1)">↑</button>
        <button class="block-btn" onclick="moveBlock(${bi},1)">↓</button>
        <button class="block-btn" onclick="duplicateBlock(${bi})">複製</button>
        <button class="block-btn" onclick="deleteBlock(${bi})">×</button>
      </div>
    </div>
    <div class="block-body">
      <div class="exercise-list">
      ${b.items.map((x,ii)=>`
        <div>
          <div class="exercise">
            <div class="ex-num">${ii+1}</div>
            <div><div class="ex-name">${esc(x.name)}</div><input class="ex-detail" value="${esc(x.detail)}" onchange="blocks[${bi}].items[${ii}].detail=this.value" placeholder="時間／距離／次數／RPE"></div>
            <div class="ex-actions">
              <button class="replace" onclick="openPicker(${bi},${ii},'replace')">⇄ 替換</button>
              <button class="exbtn" onclick="duplicateItem(${bi},${ii})">複製</button>
              <button class="exbtn" onclick="moveItem(${bi},${ii},-1)">↑</button>
              <button class="exbtn" onclick="moveItem(${bi},${ii},1)">↓</button>
              <button class="exbtn" onclick="deleteItem(${bi},${ii})">×</button>
            </div>
          </div>
          ${ii<b.items.length-1?`<div class="insert-row"><button class="insert" onclick="openPicker(${bi},${ii},'insert')">＋ 在這裡插入</button></div>`:''}
        </div>`).join('')}
      </div>
      <button class="add-in-block" onclick="openPicker(${bi},null,'append')">＋ 加到 Block ${bi+1}</button>
    </div>
  </section>`).join('');
  sumBlocks.textContent=blocks.length;sumMoves.textContent=blocks.reduce((s,b)=>s+b.items.length,0);
}
function toggleBlock(i){blocks[i].collapsed=!blocks[i].collapsed;render()}
function moveBlock(i,d){const j=i+d;if(j<0||j>=blocks.length)return;[blocks[i],blocks[j]]=[blocks[j],blocks[i]];activeBlock=j;render()}
function duplicateBlock(i){blocks.splice(i+1,0,JSON.parse(JSON.stringify(blocks[i])));activeBlock=i+1;render()}
function deleteBlock(i){if(blocks.length<=1)return;blocks.splice(i,1);activeBlock=Math.min(activeBlock,blocks.length-1);render()}
function addBlock(){blocks.push({rounds:1,rest:'60 sec',collapsed:false,items:[]});activeBlock=blocks.length-1;render()}
function duplicateItem(b,i){blocks[b].items.splice(i+1,0,{...blocks[b].items[i]});render()}
function moveItem(b,i,d){const a=blocks[b].items,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];render()}
function deleteItem(b,i){blocks[b].items.splice(i,1);render()}
function openPicker(b,i,m){target={block:b,item:i,mode:m};activeCat='全部';pickerTitle.textContent=m==='replace'?'替換動作':'新增動作';pickerSub.textContent=m==='replace'?`直接取代「${blocks[b].items[i].name}」，位置仍留在 Block ${b+1}。`:`加入 Block ${b+1}`;search.value='';customName.value='';modal.classList.add('open');renderChips();renderOptions()}
function closePicker(){modal.classList.remove('open')}
function renderChips(){const cats=['全部','TRX','Bodyweight','Core','Cardio','Carry','Conditioning','Kettlebell'];chips.innerHTML=cats.map(c=>`<button class="chip ${c===activeCat?'on':''}" onclick="activeCat='${c}';renderChips();renderOptions()">${c}</button>`).join('')}
function renderOptions(){const s=search.value.trim().toLowerCase();const rows=library.filter(([n,c])=>(activeCat==='全部'||c===activeCat)&&(!s||n.toLowerCase().includes(s)||c.toLowerCase().includes(s)));options.innerHTML=rows.length?rows.map(([n,c])=>`<button class="option" onclick="chooseExercise('${n.replaceAll("'","\\'")}')"><b>${esc(n)}</b><span>${esc(c)}</span></button>`).join(''):'<div style="color:#7f8c9d;font-size:11px;padding:12px">找不到。可以在下方直接新增自己的動作。</div>'}
function chooseExercise(name){const b=blocks[target.block];if(target.mode==='replace')b.items[target.item]={name,detail:''};else if(target.mode==='insert')b.items.splice(target.item+1,0,{name,detail:''});else b.items.push({name,detail:''});closePicker();render()}
function addCustom(){const n=customName.value.trim();if(!n)return;if(!library.some(x=>x[0].toLowerCase()===n.toLowerCase()))library.push([n,'Custom']);chooseExercise(n)}
render();
</script>
</body>
</html>
